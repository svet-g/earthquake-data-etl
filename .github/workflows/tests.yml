name: Earthquake ETL Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run ETL tests
    runs-on: ubuntu-latest
    env:
      ENV: test
      SOURCE_DB_NAME: ":memory:"
      SOURCE_DB_HOST: localhost
      TARGET_DB_NAME: ":memory:"
      TARGET_DB_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          echo 'ENV=test' > .env.test
          echo 'SOURCE_DB_NAME=":memory:"' >> .env.test
          echo 'SOURCE_DB_USER=' >> .env.test
          echo 'SOURCE_DB_PASSWORD=' >> .env.test
          echo 'SOURCE_DB_HOST=localhost' >> .env.test
          echo 'SOURCE_DB_PORT=5432' >> .env.test
          echo 'TARGET_DB_NAME=":memory:"' >> .env.test
          echo 'TARGET_DB_USER=' >> .env.test
          echo 'TARGET_DB_PASSWORD=' >> .env.test
          echo 'TARGET_DB_HOST=localhost' >> .env.test
          echo 'TARGET_DB_PORT=5432' >> .env.test

      - name: Create prod environment file for tests
        run: |
          echo 'ENV=prod' > .env
          echo 'SOURCE_DB_NAME=test_db' >> .env
          echo 'SOURCE_DB_USER=test_user' >> .env
          echo 'SOURCE_DB_PASSWORD=test_pass' >> .env
          echo 'SOURCE_DB_HOST=localhost' >> .env
          echo 'SOURCE_DB_PORT=5432' >> .env
          echo 'TARGET_DB_NAME=test_db' >> .env
          echo 'TARGET_DB_USER=test_user' >> .env
          echo 'TARGET_DB_PASSWORD=test_pass' >> .env
          echo 'TARGET_DB_HOST=localhost' >> .env
          echo 'TARGET_DB_PORT=5432' >> .env

      - name: Run tests with proper error handling
        run: |
          # Use pytest directly instead of run_tests to ensure proper exit codes
          python -m pytest tests/ -v --cov=src --cov-report=xml -x
